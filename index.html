<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영전 안전보건 소모품 지급대장</title>
    <style>
        :root { --primary: #007bff; --success: #28a745; --dark: #343a40; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 15px; color: var(--dark); }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-top: 0; color: #111; font-size: 22px; border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; }
        input[type="text"], input[type="date"], select { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        .signature-container { border: 1px solid #6c757d; background: #fafafa; border-radius: 6px; position: relative; margin-top: 5px; }
        canvas { width: 100%; height: 180px; display: block; cursor: crosshair; touch-action: none; }
        .btn-clear { background: #6c757d; color: white; border: none; padding: 6px 12px; font-size: 12px; border-radius: 4px; cursor: pointer; position: absolute; top: 5px; right: 5px; z-index: 10; }
        .btn-submit { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .btn-submit:hover { background: #0056b3; }
        .btn-submit:disabled { background: #cccccc; cursor: not-allowed; }
        .loading { display: none; text-align: center; font-weight: bold; color: var(--primary); margin-top: 10px; font-size: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>소모성 보호구 수시 지급대장</h2>
    <form id="safetyForm">
        <div class="form-group">
            <label>지급일자</label>
            <input type="date" id="issueDate" required>
        </div>
        <div class="form-group">
            <label>소속 회사</label>
            <select id="company" required>
                <option value="영전하이테크">영전하이테크</option>
                <option value="영전엔지니어링">영전엔지니어링</option>
                <option value="기타">기타 (직접 입력)</option>
            </select>
            <input type="text" id="companyEtc" placeholder="회사명 직접 입력" style="display:none; margin-top:5px;">
        </div>
        <div class="form-group">
            <label>소속 팀장이름</label>
            <input type="text" id="teamLeader" placeholder="예: 홍길동" required>
        </div>
        <div class="form-group">
            <label>근로자 성명</label>
            <input type="text" id="workerName" placeholder="예: 김철수" required>
        </div>
        <div class="form-group">
            <label>수령 보호구 품목 (상세 규격 및 수량)</label>
            <input type="text" id="items" placeholder="예: 자상방지장갑 1켤레, 방진마스크 3개" required>
        </div>
        <div class="form-group">
            <label>근로자 자필 서명 (손가락 또는 펜으로 사인)</label>
            <div class="signature-container">
                <canvas id="sigCanvas"></canvas>
                <button type="button" class="btn-clear" id="btnClear">지우기</button>
            </div>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">지급 완료 제출</button>
        <div class="loading" id="loadingText">⏳ 구글 엑셀 창고로 데이터를 안전하게 전송 중입니다...</div>
    </form>
</div>

<script>
    // 구글 앱스 스크립트 웹앱 배포 주소
    const GOOGLE_SERVER_URL = "https://script.google.com/macros/s/AKfycbyaTRQZwqNPnVtRULQ8Q7w0E4e3ru-gwmBkWZk-kQF0-oivnndaB5He4fY6mfiRkixv/exec";

    document.getElementById('issueDate').value = new Date().toISOString().substring(0, 10);

    const companySelect = document.getElementById('company');
    const companyEtc = document.getElementById('companyEtc');
    companySelect.addEventListener('change', function() {
        companyEtc.style.display = this.value === '기타' ? 'block' : 'none';
    });

    const canvas = document.getElementById('sigCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let hasSigned = false;

    function resizeCanvas() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
        ctx.lineWidth = 3;
        ctx.lineCap = "round";
        ctx.strokeStyle = "#000";
    }
    
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('DOMContentLoaded', resizeCanvas);
    setTimeout(resizeCanvas, 300);

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        let clientX, clientY;
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDraw(e) { 
        isDrawing = true; 
        hasSigned = true;
        const pos = getPos(e); 
        ctx.beginPath(); 
        ctx.moveTo(pos.x, pos.y); 
        if (e.type.startsWith('touch')) e.preventDefault(); 
    }
    
    function draw(e) { 
        if(!isDrawing) return; 
        const pos = getPos(e); 
        ctx.lineTo(pos.x, pos.y); 
        ctx.stroke(); 
        if (e.type.startsWith('touch')) e.preventDefault(); 
    }
    
    function endDraw() { isDrawing = false; }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', endDraw);
    
    canvas.addEventListener('touchstart', startDraw, {passive: false});
    canvas.addEventListener('touchmove', draw, {passive: false});
    window.addEventListener('touchend', endDraw);

    document.getElementById('btnClear').addEventListener('click', () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        hasSigned = false;
    });

    // 폼 제출 이벤트 처리
    document.getElementById('safetyForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        if(!hasSigned) {
            alert('근로자 자필 서명이 누락되었습니다. 사인을 그려주세요.');
            return;
        }

        const compValue = companySelect.value === '기타' ? companyEtc.value.trim() : companySelect.value;
        const submitBtn = document.getElementById('submitBtn');
        const loadingText = document.getElementById('loadingText');

        // 서명 이미지 Base64 인코딩 데이터
        const signatureData = canvas.toDataURL('image/png');

        const formData = {
            issueDate: document.getElementById('issueDate').value,
            company: compValue,
            teamLeader: document.getElementById('teamLeader').value,
            workerName: document.getElementById('workerName').value,
            items: document.getElementById('items').value,
            signature: signatureData
        };

        // 버튼 비활성화 및 로딩 표시
        submitBtn.disabled = true;
        loadingText.style.display = 'block';

        // 구글 앱스 스크립트로 데이터 전송
        fetch(GOOGLE_SERVER_URL, {
            method: 'POST',
            mode: 'no-cors', // 구글 앱스 스크립트 우회 설정
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        })
        .then(() => {
            alert('지급 내역이 구글 엑셀 창고로 정상 제출되었습니다.');
            // 폼 및 서명 초기화
            document.getElementById('safetyForm').reset();
            document.getElementById('issueDate').value = new Date().toISOString().substring(0, 10);
            companyEtc.style.display = 'none';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hasSigned = false;
        })
        .catch(error => {
            console.error('Error:', error);
            alert('전송 중 오류가 발생했습니다. 다시 시도해주세요.');
        })
        .finally(() => {
            submitBtn.disabled = false;
            loadingText.style.display = 'none';
        });
    });
</script>
</body>
</html>
